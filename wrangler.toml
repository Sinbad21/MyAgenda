name = "myagenda"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Pages output dir (generato da @cloudflare/next-on-pages)
pages_build_output_dir = ".vercel/output/static"

[[d1_databases]]
binding = "DB"
database_name = "myagenda-db"
database_id = "PLACEHOLDER_DA_SOSTITUIRE"

[[r2_buckets]]
binding = "R2"
bucket_name = "myagenda-uploads"

# Cron trigger ogni 5 minuti — attiva /api/cron via scheduled worker
[triggers]
crons = ["*/5 * * * *"]
